services:
  mysql:
    image: mysql:8.4
    container_name: magnetpay-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: magnetpay_root
      MYSQL_DATABASE: magnetpay
      MYSQL_USER: magnetpay
      MYSQL_PASSWORD: magnetpay
    volumes:
      - magnetpay_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pmagnetpay_root"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:4
    container_name: magnetpay-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  magnetpay_mysql_data:
